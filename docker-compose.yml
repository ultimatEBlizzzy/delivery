# Local / demo stack: PostgreSQL + PostGIS, the API and the web app.
#
#   cp .env.example .env            (then review the values marked CHANGE-ME)
#   docker compose up -d db         database only – run the API and web with npm (see README)
#   docker compose up -d --build    the whole stack  ->  web http://localhost:8080 · API http://localhost:3000/api/docs
#   docker compose exec backend node dist/database/cli/seed.js     load demo data (never in production)
#
name: hardware-delivery

services:
  db:
    image: postgis/postgis:${POSTGIS_IMAGE_TAG:-16-3.4}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hd_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-hardware_delivery}
    ports:
      # Bound to localhost only; never expose the database port publicly.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside the compose network the database host is "db" (the .env value targets host-run processes).
      # URL-encode special characters in POSTGRES_PASSWORD.
      DATABASE_URL: postgresql://${POSTGRES_USER:-hd_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hardware_delivery}
      PORT: '3000'
      UPLOAD_DIR: /app/uploads
      TRUST_PROXY: '1' # nginx sits in front
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      APP_URL: ${APP_URL:-http://localhost:8080}
    volumes:
      - uploads:/app/uploads
    ports:
      - '${API_PORT:-3000}:3000'

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_APP_NAME: ${VITE_APP_NAME:-BuildRun}
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
        VITE_ENABLE_LOCATION_SIMULATOR: ${VITE_ENABLE_LOCATION_SIMULATOR:-true}
        VITE_SHOW_DEMO_ACCOUNTS: ${VITE_SHOW_DEMO_ACCOUNTS:-true}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  pgdata:
  uploads:
