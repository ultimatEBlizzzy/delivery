name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: hd_user
          POSTGRES_PASSWORD: hd_password
          POSTGRES_DB: hardware_delivery_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hd_user -d hardware_delivery_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Integration tests run against a real PostgreSQL + PostGIS server (schema is wiped per run).
      TEST_DATABASE_URL: postgresql://hd_user:hd_password@localhost:5432/hardware_delivery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
