# nginx for the single-page app. Used by docker/frontend.Dockerfile.
# `backend` is the API service name from docker-compose.yml – change it if the API lives elsewhere.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 12m;           # document / proof-of-delivery uploads (API limit is 10 MB)

  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Security headers. NOTE: `expires` (unlike add_header) does not reset these in nested locations.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(self), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  location /uploads/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    expires 7d;
  }

  # Hashed build assets are immutable.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # SPA fallback: unknown paths are client-side routes. index.html itself must never be cached.
  location / {
    try_files $uri /index.html;
    expires -1;
  }
}
